apply plugin: 'com.android.application'

Properties props = new Properties()
props.load(new FileInputStream(file("signing.properties")))

// 版本信息提取为变量,供 defaultConfig 与 androidComponents 自定义 APK 命名共用
def appVersionCode = 354
def appVersionName = "3.5.4"

android {
    // AGP 8+ 要求 namespace 在 build.gradle 声明,替代 manifest 的 package 属性
    namespace "com.raincat.dolby_beta"

    // 升级至 API 37(Android 17 平台),AGP 9.2.1 自带默认 buildTools,无需显式声明
    compileSdk 37

    defaultConfig {
        applicationId "com.raincat.dolby_beta"
        minSdk 21
        targetSdk 37
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release{
            keyAlias props['KEY_ALIAS']
            keyPassword props['KEY_PASSWORD']
            storeFile file(props['KEYSTORE_FILE'])
            storePassword props['KEYSTORE_PASSWORD']
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "LOG_DEBUG", "false" //不显示log
            shrinkResources false //资源压缩
            minifyEnabled false //混淆
            // AGP 9 不再支持 proguard-android.txt(含 -dontoptimize 阻止 R8 优化),改用 optimize 版本;本构建 minifyEnabled=false 实际不混淆
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // AGP 9 已移除 lintOptions,改用 lint
    lint {
        abortOnError false
    }

    // AGP 9 默认关闭 BuildConfig 生成;release 用了 buildConfigField(LOG_DEBUG),需显式启用
    buildFeatures {
        buildConfig true
    }
}

// AGP 9 移除了 android.applicationVariants,旧式 apply plugin 下的 androidComponents 是受限的 Compat 扩展;
// 此处用 assembleRelease 任务钩子重命名 release APK,避免依赖 variant API,稳定且改动最小
tasks.configureEach { task ->
    if (task.name == 'assembleRelease') {
        task.doLast {
            def releaseDir = layout.buildDirectory.dir("outputs/apk/release").get().asFile
            releaseDir.listFiles()?.each { f ->
                if (f.name.endsWith('.apk')) {
                    def createTime = new Date().format("YYYYMMdd", TimeZone.getTimeZone("GMT+08:00"))
                    f.renameTo(new File(releaseDir, "dolby_beta_" + appVersionName + "_" + createTime + "-release.apk"))
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    //xposed库
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
    implementation 'com.annimon:stream:1.2.2'
    implementation 'org.smali:dexlib2:2.3.4'
    implementation 'com.google.guava:guava:28.2-android'
    implementation 'com.google.code.gson:gson:2.8.9'

    implementation project(':hotxposed')
}
