apply plugin: 'com.android.library'

android {
  // AGP 8+ 要求 namespace 在 build.gradle 声明,替代 manifest 的 package 属性
  namespace "net.androidwing.hotxposed"

  // 与 app 模块保持一致:API 37
  compileSdk 37
  defaultConfig {
    minSdk 14
    targetSdk 37
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  // AGP 9 已移除 lintOptions,改用 lint
  lint {
    abortOnError false
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])
  compileOnly 'de.robv.android.xposed:api:82'
  implementation 'androidx.appcompat:appcompat:1.2.0'
}
